name: Build & Deploy to GitHub Pages

# Deployment model: this workflow only BUILDS and pushes the built site to the
# gh-pages branch. GitHub's built-in "pages build and deployment" job then
# publishes that branch, because Settings -> Pages -> Source is
# "Deploy from a branch: gh-pages".
#
# Do not add an actions/deploy-pages job here while the source is a branch:
# the github-pages environment only allows the configured source branch to
# deploy, so a job running on main is rejected with
# 'Branch "main" is not allowed to deploy to github-pages'.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type check (non-blocking)
        continue-on-error: true
        run: npx tsc -b

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: Add SPA fallback and .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
